[project]
name = "fpl-tool"
version = "0.1.0"
description = "FPL decision engine: xPts, minutes, fixture strength, multi-GW MILP optimizer, chip planner."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pandas>=2.2",
    "pyarrow>=16",
    "typer>=0.12",
    "rich>=13.7",
    "numpy>=2.5.4",
    "scipy>=1.18.1",
    "scikit-learn>=1.9.1",
    "highspy>=1.15.1",
    "streamlit>=1.67.0",
    "tabulate>=0.10.0",
]

[project.scripts]
fpl = "fpl.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "respx>=0.21",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fpl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: hits the real FPL API (deselected by default; run with -m live)",
    "ui: drives the dashboard page in Chromium (deselected by default; run with -m ui)",
]
addopts = "-m 'not live and not ui'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"scripts/research/*" = ["E402", "E501", "E702", "I001", "UP031"]
"scripts/dashboard_preview.py" = ["E501"]  # embedded CSS and JS
